<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
		<title>The Singularity Blues</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#sitcom-bar {
	position: absolute; left: 10px; right: 10px; top: 10px; z-index: 20;
	display: flex; gap: 8px; align-items: center;
	font: 16px/1.3 ui-sans-serif, system-ui, sans-serif;
	pointer-events: none;
}
#sitcom-bar > * { pointer-events: auto; }
#sitcom-gen {
	font-size: 16px; background: #3d7dff; color: #fff; border: 0;
	border-radius: 12px; padding: 12px 14px; cursor: pointer;
	flex: 0 0 auto; box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
#sitcom-gen:disabled { opacity: .55; }
#sitcom-prompt {
	flex: 1; min-width: 0; font-size: 16px !important;
	background: #151b2ecc; color: #e8f0ff; border: 1px solid #2a3a60;
	border-radius: 12px; padding: 10px 12px;
}
#sitcom-status {
	position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 20;
	color: #8aa0c8; font: 16px/1.3 ui-sans-serif, system-ui, sans-serif;
	text-shadow: 0 1px 2px #000; pointer-events: none;
}
#sitcom-status.ok { color: #7dffb3; }
#sitcom-status.bad { color: #ff8d8d; }
#sitcom-set {
	position: absolute; left: 12px; top: 58px; z-index: 20;
	color: #c9b48a; font: 13px/1.3 ui-sans-serif, system-ui, sans-serif;
	letter-spacing: 0.08em; text-transform: uppercase; pointer-events: none;
	text-shadow: 0 1px 2px #000;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<div id="sitcom-bar">
			<button id="sitcom-gen" type="button">Ask the Selector</button>
			<input id="sitcom-prompt" type="text" placeholder="A suggestion. Not a command." autocomplete="off" autocorrect="off" />
		</div>
		<p id="sitcom-status"></p>
		<p id="sitcom-set"></p>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":107360,"index.wasm":43699190},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		const sitcomStatus = document.getElementById('sitcom-status');
		async function waitForVoicedShow() {
			if (sitcomStatus) sitcomStatus.textContent = 'The house is waking up…';
			for (let i = 0; i < 300; i++) {
				try {
					const d = await (await fetch('/now-playing')).json();
					const beats = (d && d.beats) || [];
					if (beats.length && beats.some((b) => b.audio)) return d;
				} catch (e) {}
				await new Promise((r) => setTimeout(r, 1000));
			}
			return null;
		}
		waitForVoicedShow().then(() => {
			if (sitcomStatus) sitcomStatus.textContent = '';
			return engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					} else {
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
					}
				},
			});
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>

		<script>
(function () {
	function unlockAudio() {
		try {
			if (window.GodotAudio && GodotAudio.ctx && GodotAudio.ctx.state !== 'running') {
				GodotAudio.ctx.resume();
			}
		} catch (e) {}
		const canvas = document.getElementById('canvas');
		if (canvas) canvas.focus();
		window.scrollTo(0, 0);
	}
	const gen = document.getElementById('sitcom-gen');
	const prompt = document.getElementById('sitcom-prompt');
	const status = document.getElementById('sitcom-status');
	if (!gen) return;
	const setEl = document.getElementById('sitcom-set');
	const SET_LABELS = {living_room:'Living room', kitchen:'Kitchen', front_yard:'Front yard', porch:'Porch', hallway:'Hallway'};
	async function refreshSet() {
		try {
			const d = await (await fetch('/now-playing')).json();
			if (setEl && d && d.scene) setEl.textContent = SET_LABELS[d.scene] || d.scene;
		} catch (e) {}
	}
	refreshSet();
	setInterval(refreshSet, 2000);
	prompt.addEventListener('blur', () => {
		window.scrollTo(0, 0);
		document.documentElement.scrollTop = 0;
		setTimeout(() => window.scrollTo(0, 0), 50);
	});
	gen.addEventListener('click', async () => {
		unlockAudio();
		prompt.blur();
		gen.disabled = true;
		status.className = '';
		status.textContent = 'The Selector is listening. This scene keeps playing…';
		try {
			const text = prompt.value.trim();
			const started = await fetch('/episode', {
				method: 'POST',
				headers: {'Content-Type': 'application/json'},
				body: JSON.stringify(text ? {topic: text} : {})
			});
			const startData = await started.json();
			if (!started.ok) {
				status.className = 'bad';
				status.textContent = startData.detail || started.statusText || 'failed';
				gen.disabled = false;
				return;
			}
			const job = startData.job_id;
			while (true) {
				const r = await fetch('/episode/status?job_id=' + encodeURIComponent(job));
				const s = await r.json();
				if (s.phase === 'writing' || s.phase === 'queued') {
					status.textContent = 'Writing the next one in the background…';
				} else if (s.phase === 'speaking') {
					const who = s.speaker ? (' · ' + s.speaker) : '';
					status.textContent = 'Casting voices ' + (s.beat || 0) + '/' + (s.beats || 0) + who;
				} else if (s.status === 'ready') {
					status.className = 'ok';
					status.textContent = 'Up next: ep ' + (s.episode_id ?? '') + ' · ' + (s.topic || '');
					unlockAudio();
					gen.disabled = false;
					return;
				} else if (s.status === 'error') {
					status.className = 'bad';
					status.textContent = s.error || 'failed';
					gen.disabled = false;
					return;
				}
				await new Promise((resolve) => setTimeout(resolve, 450));
			}
		} catch (err) {
			status.className = 'bad';
			status.textContent = String(err);
			gen.disabled = false;
		}
	});
})();
		</script>
	</body>
</html>
