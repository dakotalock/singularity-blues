<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>The Singularity Blues</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    :root { color-scheme: dark; }
    body { font: 17px/1.45 ui-sans-serif, system-ui, sans-serif; background:#0b1020; color:#d6e4ff; margin:0; }
    main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-size: 1.35rem; color: #8ec5ff; margin: 0 0 8px; }
    textarea { width: 100%; min-height: 64px; background:#151b2e; color:#e8f0ff; border:1px solid #2a3a60; border-radius:10px; padding:10px; box-sizing:border-box; }
    button { font-size: 1.05rem; background:#3d7dff; color:white; border:0; border-radius:12px; padding:14px 18px; cursor:pointer; width:100%; }
    button:disabled { opacity: 0.55; cursor: wait; }
    .muted { color:#8aa0c8; font-size: 0.92rem; }
    .beat { margin: 10px 0; padding: 10px 12px; background:#12182a; border-left: 3px solid #3d7dff; border-radius: 0 8px 8px 0; }
    .beat b { text-transform: capitalize; color:#b9d4ff; }
    .ok { color:#7dffb3; }
    .bad { color:#ff8d8d; }
    audio { width: 100%; margin-top: 6px; }
  </style>
</head>
<body>
<main>
  <h1>The Singularity Blues</h1>
  <p class="muted">Tap once. Gemini writes a new episode. Optional prompt is a suggestion, not a command.</p>
  <p><button id="gen">Generate episode</button></p>
  <textarea id="prompt" placeholder="Optional: suggest a scene"></textarea>
  <p id="status" class="muted"></p>
  <h2>Now playing</h2>
  <div id="now" class="muted">no episode yet</div>
</main>
<script>
function renderEpisode(data) {
  const el = document.getElementById('now');
  if (!data || !data.beats || !data.beats.length) {
    el.textContent = 'no episode yet';
    return;
  }
  const beats = data.beats.map(b => {
    const src = b.audio ? (b.audio.startsWith('/') ? b.audio : '/' + b.audio) : '';
    const audio = src ? `<audio controls src="${src}"></audio>` : '';
    return `<div class="beat"><b>${b.speaker}</b> (${b.emotion || ''}) ${b.line || ''}${audio}</div>`;
  }).join('');
  el.innerHTML = `<p><b>ep ${data.episode_id ?? ''}</b> · ${data.topic || ''}</p>` + beats;
}
async function refresh() {
  const r = await fetch('/now-playing');
  renderEpisode(await r.json());
}
document.getElementById('gen').onclick = async () => {
  const btn = document.getElementById('gen');
  const status = document.getElementById('status');
  const text = document.getElementById('prompt').value.trim();
  btn.disabled = true;
  status.className = 'muted';
  status.textContent = 'Gemini is writing…';
  try {
    const r = await fetch('/episode', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(text ? {topic: text} : {})
    });
    const data = await r.json();
    if (!r.ok) {
      status.className = 'bad';
      status.textContent = (data.detail || r.statusText || 'failed');
      return;
    }
    status.className = 'ok';
    status.textContent = 'ep ' + data.episode_id + ' · ' + (data.writer || 'gemini');
    renderEpisode(data);
  } catch (err) {
    status.className = 'bad';
    status.textContent = String(err);
  } finally {
    btn.disabled = false;
  }
};
refresh();
</script>
</body>
</html>
