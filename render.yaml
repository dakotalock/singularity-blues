services:
  - type: web
    name: singularity-blues
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python tools/assemble_web_engine.py && python tools/fetch_piper.py
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_WRITER_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
