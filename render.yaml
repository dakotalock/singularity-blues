services:
  - type: web
    name: singularity-blues
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python tools/assemble_web_engine.py && python tools/fetch_piper.py && python tools/fetch_ffmpeg.py
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_WRITER_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Cheap TV feed: render scene packets once as H.264/AAC segments. The
      # public Godot/WebGL player is separate and keeps its full fidelity.
      - key: BROADCAST_VIDEO_ENABLED
        value: "1"
      - key: BROADCAST_BUFFER_SECONDS
        value: "60"
      - key: BROADCAST_ENCODER_THREADS
        value: "1"
      # Limit background rendering to 2.5x real time so paid prompts/Piper keep
      # CPU priority. The completed R2 rerun buffer absorbs this delay.
      - key: BROADCAST_RENDER_SPEED_LIMIT
        value: "2.5"
      - key: BROADCAST_MAX_DISK_MB
        value: "384"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Public custom-domain/base URL for the same R2 bucket. This keeps the
      # large 24/7 segment traffic off Render after each one-time upload.
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: OWNER_PROMPT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://singularity-blues.onrender.com
      - key: STRIPE_PRICE_1
        value: price_1U8uTFP7GC34loHe2Es9DQ9J
      - key: STRIPE_PRICE_5
        value: price_1U8uTGP7GC34loHeXOgvN3rn
      - key: STRIPE_PRICE_10
        value: price_1U8uTGP7GC34loHeCLoowbVf
      - key: STRIPE_PRICE_20
        value: price_1U8uTHP7GC34loHeN1Goa4MJ
